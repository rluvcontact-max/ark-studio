<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARK">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ARK Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: glass sidebar + glass panels floating over a slow monochrome field; bottom glass tab bar on phones */
:root{
  --bg:#e9ebef; --fg:#0b0c0e; --muted:#5b616c; --faint:#8a909b;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.78);
  --stroke:rgba(255,255,255,.85); --hair:rgba(12,14,18,.09); --spec:rgba(255,255,255,.95);
  --shadow:rgba(22,26,34,.16); --blob-a:#c3c8d1; --blob-b:#ffffff; --blob-c:#9ea4ae;
  --ink:#0b0c0e; --on-ink:#ffffff; --danger:#b42318;
  --display:"Michroma","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060708; --fg:#f1f2f4; --muted:#949aa5; --faint:#646a74;
  --glass:rgba(30,32,37,.46); --glass-strong:rgba(38,40,46,.78);
  --stroke:rgba(255,255,255,.13); --hair:rgba(255,255,255,.08); --spec:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.55); --blob-a:#25282e; --blob-b:#4b505a; --blob-c:#15171b;
  --ink:#f1f2f4; --on-ink:#0b0c0e; --danger:#ff8a80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#060708; --fg:#f1f2f4; --muted:#949aa5; --faint:#646a74;
  --glass:rgba(30,32,37,.46); --glass-strong:rgba(38,40,46,.78);
  --stroke:rgba(255,255,255,.13); --hair:rgba(255,255,255,.08); --spec:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.55); --blob-a:#25282e; --blob-b:#4b505a; --blob-c:#15171b;
  --ink:#f1f2f4; --on-ink:#0b0c0e; --danger:#ff8a80; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* ambient field behind the glass */
.field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle at 40% 40%,var(--blob-b),var(--blob-a) 70%);animation:drift 28s ease-in-out infinite alternate}
.b2{width:38vmax;height:38vmax;right:-10vmax;top:20vh;background:radial-gradient(circle,var(--blob-a),transparent 70%);animation:drift 34s ease-in-out infinite alternate-reverse}
.b3{width:34vmax;height:34vmax;left:30vw;bottom:-18vmax;background:radial-gradient(circle,var(--blob-c),transparent 70%);animation:drift 40s ease-in-out infinite alternate}
.watermark{position:absolute;right:-6vmax;bottom:-4vmax;width:62vmax;color:var(--fg);opacity:.045}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none}}

/* liquid glass material */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--stroke);border-radius:var(--r-lg);
  box-shadow:inset 0 1px 0 var(--spec),inset 0 -1px 0 var(--hair),0 18px 40px -18px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,var(--spec) 0%,transparent 28%,transparent 72%,var(--hair) 100%);opacity:.35}

.app{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;min-height:100%;padding-inline:20px;padding-block:20px}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 40px);display:flex;flex-direction:column;gap:28px;padding:26px 18px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-inline:8px}
.brand svg{width:54px;height:36px;color:var(--fg)}
.wordmark{font-family:var(--display);letter-spacing:.42em;font-size:17px}
.brand small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;flex-direction:column;gap:4px}
.tab{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.tab svg{width:19px;height:19px;flex:none}
.tab:hover{color:var(--fg);background:var(--hair)}
.tab[aria-current="page"]{color:var(--fg);background:var(--glass-strong);border-color:var(--stroke);box-shadow:inset 0 1px 0 var(--spec),0 6px 16px -10px var(--shadow)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.theme-switch{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--hair);gap:4px}
.theme-switch button{border:0;background:none;padding:7px 0;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.theme-switch button[aria-pressed="true"]{background:var(--glass-strong);color:var(--fg);box-shadow:inset 0 1px 0 var(--spec),0 2px 8px -4px var(--shadow)}
.sync{font-size:12px;color:var(--faint);padding-inline:6px;display:flex;align-items:center;gap:8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--fg)}

main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:6px 4px 0}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.4vw,28px);letter-spacing:.08em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;border:1px solid var(--stroke);cursor:pointer;font-weight:600;font-size:14px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 var(--spec),0 8px 20px -12px var(--shadow);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px -12px var(--shadow)}
.btn.ghost{background:none;box-shadow:none;border-color:var(--hair)}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.btn-sm{padding:6px 12px;font-size:13px}

.panel{padding:22px}
.panel h2{margin:0 0 16px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px}
.stat{padding:18px 20px;border-right:1px solid var(--hair)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.04em}

.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.fstep{padding:14px 12px;border-radius:var(--r-sm);background:var(--hair);display:flex;flex-direction:column;gap:2px;min-width:0}
.fstep b{font-family:var(--mono);font-size:22px;font-weight:500}
.fstep span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.fstep.last{background:var(--ink);color:var(--on-ink)}
.fstep.last span{color:inherit;opacity:.7}

.rank{display:flex;flex-direction:column;gap:14px}
.rank-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center}
.bar{height:8px;border-radius:99px;background:var(--hair);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%;background:var(--fg)}
.bar i.open{background:var(--faint)}
.rank-row .n{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;background:var(--glass-strong);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--spec);flex:none}
.avatar.sm{width:24px;height:24px;font-size:10px}
.avatar{overflow:hidden;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
button.avatar{cursor:pointer;color:inherit;position:relative}
button.avatar::after{content:"Foto";position:absolute;inset:0;display:grid;place-items:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .15s}
button.avatar:hover::after,button.avatar:focus-visible::after{opacity:1}
.photo-pick{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.photo-pick .avatar{width:72px;height:72px;font-size:22px}
.photo-pick .btns{display:flex;gap:8px;flex-wrap:wrap}

.list{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--hair)}
.ev:first-child{border-top:0}
.ev .when{font-family:var(--mono);font-size:12px;line-height:1.3;color:var(--muted)}
.ev .when b{display:block;color:var(--fg);font-weight:500;font-size:14px}
.ev .t{font-weight:600;overflow-wrap:anywhere}
.ev .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}

/* clientes */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px}
.search{flex:1 1 220px;height:42px;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--hair)}
.search input{border:0;background:none;outline:none;width:100%;min-width:0}
.search svg{width:16px;color:var(--muted);flex:none}
select.pill,.field-in{padding:9px 14px;border-radius:999px;border:1px solid var(--hair);background:var(--glass-strong);max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--hair);background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:transparent}

.table{display:flex;flex-direction:column;padding:6px 8px}
.trow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1fr) 28px;gap:14px;align-items:center;padding:14px 12px;border-top:1px solid var(--hair);cursor:pointer;border-radius:14px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.trow:hover{background:var(--hair)}
.thead{cursor:default;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-top:0;padding-block:8px}
.thead:hover{background:none}
.cell-main b{display:block;font-weight:600;overflow-wrap:anywhere}
.cell-main span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.chev{width:16px;color:var(--faint)}

/* estado: encoded by form, monochrome */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--fg);white-space:nowrap;width:max-content;max-width:100%}
.st::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
.st.prospecto{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.st.llamada::before{background:linear-gradient(90deg,currentColor 33%,transparent 0)}
.st.whatsapp::before{background:linear-gradient(90deg,currentColor 66%,transparent 0)}
.st.propuesta{background:var(--hair)}
.st.propuesta::before{background:currentColor}
.st.cerrado{background:var(--ink);color:var(--on-ink);border-color:transparent}
.st.cerrado::before{background:currentColor}
.st.perdido{color:var(--faint);border-color:var(--hair);text-decoration:line-through}

/* calendario */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-head h2{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.08em;font-size:17px;text-transform:capitalize;color:var(--fg)}
.navbtns{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hair);background:var(--glass-strong);cursor:pointer}
.icon-btn svg{width:16px}
.dow,.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:6px}
.day{min-height:96px;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:4px;background:var(--hair);border:1px solid transparent;cursor:pointer;text-align:left;min-width:0}
.day.out{opacity:.38}
.day:hover{border-color:var(--stroke)}
.day.sel{background:var(--glass-strong);border-color:var(--stroke);box-shadow:inset 0 1px 0 var(--spec),0 8px 18px -12px var(--shadow)}
.day .num{font-family:var(--mono);font-size:13px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .num{background:var(--ink);color:var(--on-ink)}
.pill-ev{font-size:11px;line-height:1.25;padding:3px 6px;border-radius:6px;background:var(--glass-strong);border:1px solid var(--stroke);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-ev b{font-family:var(--mono);font-weight:500;margin-right:4px}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--fg)}
.agenda h3{margin:0;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:capitalize}
.agenda .ev{grid-template-columns:52px minmax(0,1fr) auto;cursor:pointer;border-radius:12px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.agenda .ev:hover{background:var(--hair)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--hair);color:var(--muted);white-space:nowrap}

/* equipo */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.member{padding:22px;display:flex;flex-direction:column;gap:16px}
.member-top{display:flex;gap:14px;align-items:center}
.member-top .avatar{width:52px;height:52px;font-size:16px}
.member-top b{display:block;font-size:17px}
.member-top span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{padding:10px;border-radius:12px;background:var(--hair)}
.kv b{display:block;font-family:var(--mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv span{font-size:11px;color:var(--muted)}
.member .next{font-size:13px;color:var(--muted);border-top:1px solid var(--hair);padding-top:12px}
.member .next b{color:var(--fg);font-weight:600}
.member-actions{display:flex;gap:8px;flex-wrap:wrap}

/* modal */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.28);display:grid;place-items:center;padding:16px}
.sheet{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:26px;background:var(--glass-strong)}
.sheet h3{margin:0 0 18px;font-family:var(--display);font-weight:400;letter-spacing:.06em;font-size:18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.06em;color:var(--muted);min-width:0}
.form label.full,.form div.full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:11px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--glass);font-size:15px;letter-spacing:0;color:var(--fg);width:100%;min-width:0}
.form textarea{min-height:84px;resize:vertical}
.form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.form-actions .spacer{margin-right:auto}
.err{grid-column:1/-1;color:var(--danger);font-size:13px;margin:0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:500}
.notice{padding:12px 18px;font-size:13px;color:var(--muted);border-radius:var(--r-md)}

.mobile-bar{display:none}
.mobile-top{display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.mobile-top .brand{flex-direction:row;align-items:center;padding:0}
.mobile-top .brand svg{width:34px;height:23px}
.mobile-top .right{display:flex;align-items:center;gap:8px}
.mobile-top .out{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:6px}
.mobile-top .theme-switch{width:130px}

@media (max-width:1100px){.cal-wrap{grid-template-columns:minmax(0,1fr)}.grid-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);padding-inline:16px;padding-block:16px 110px}
  .side{display:none}
  .mobile-top{display:flex}
  .mobile-bar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:10;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:24px}
  .mobile-bar .tab{flex-direction:column;gap:3px;font-size:11px;padding:8px 4px;justify-content:center;align-items:center;text-align:center}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--hair)}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fstep.last{grid-column:1/-1}
  .thead{display:none}
  .trow{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
  .trow .who{grid-column:1}
  .trow .st{grid-row:1;grid-column:2;justify-self:end}
  .trow .money{grid-column:2;text-align:right}
  .trow .chev{display:none}
  .day{min-height:54px;padding:5px;align-items:center}
  .pill-ev,.more{display:none}
  .dots{display:flex}
  .form{grid-template-columns:1fr}
}

[hidden]{display:none!important}
.link-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.link-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.link-box code{flex:1 1 220px;min-width:0;font-family:var(--mono);font-size:13px;padding:10px 14px;border-radius:12px;background:var(--hair);overflow-wrap:anywhere;user-select:all}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--fg)}
.rec::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.rec.ok{background:var(--ink);color:var(--on-ink);border-color:transparent}
.rec.miss{border-style:dashed;color:var(--danger);border-color:var(--danger)}
.rec.miss::before{background:none;border:1.5px solid currentColor;width:4px;height:4px}

<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}
(function(){
/* ================= catálogos ================= */
const ESTADOS=[
  {k:'prospecto',l:'Prospecto'},{k:'llamada',l:'Llamada hecha'},{k:'whatsapp',l:'WhatsApp enviado'},
  {k:'propuesta',l:'Propuesta'},{k:'cerrado',l:'Cerrado'},{k:'perdido',l:'Perdido'}];
const TIPOS=['Llamada','Reunión','Seguimiento','Presentación','Entrega','Interno'];
const APPS=['App móvil','Web app','Sistema interno','E-commerce','Automatización','Otro'];
const CAT_IN=['Anticipo de proyecto','Pago de proyecto','Mensualidad / mantenimiento','Otro ingreso'];
const CAT_OUT=['Nómina','Comisiones','Freelancers','Software y suscripciones','Servidores y hosting','Publicidad','Renta y oficina','Impuestos','Equipo y herramientas','Otro gasto'];
const METODOS=['Transferencia','Efectivo','Tarjeta','Depósito'];

const data={empleados:[],clientes:[],eventos:[],finanzas:[],accesos:[],juntas:[],config:[],propuestas:[],notas:[]};
// Datos calculados en el servidor para el equipo (RPC): bonos/material, ranking del mes y ventas propias del empleado.
const extra={ajustes:{},ranking:[],misVentas:null};

const S={mode:'login',acct:null,demo:false,previewEmp:null,linkedEmp:null,names:{}};
const ui={jEmp:'todos',jq:'',view:'panel',q:'',fEmp:'todos',fEst:'todos',calEmp:'todos',mes:null,dia:null,per:'mes',fMov:'todos'};

/* ================= utilidades ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=iso(new Date());
ui.dia=today;{const t=new Date();ui.mes=new Date(t.getFullYear(),t.getMonth(),1);}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n)||0);
const moneyShort=n=>{n=Number(n)||0;const s=n<0?'-':'';n=Math.abs(n);if(n>=1e6)return s+'$'+(n/1e6).toFixed(n%1e6?1:0)+'M';if(n>=1e3)return s+'$'+Math.round(n/1e3)+'k';return s+'$'+Math.round(n)};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const emp=id=>data.empleados.find(e=>e.id===id);
const cli=id=>data.clientes.find(c=>c.id===id);
const estado=k=>ESTADOS.find(e=>e.k===k)||ESTADOS[0];
const fmtDay=s=>parse(s).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>{const d=parse(s);return {d:d.getDate(),m:d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}};
const sortedEmps=()=>[...data.empleados].sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
const sortEv=(a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||''));
const av=(e,cls='')=>`<div class="avatar ${cls}"${e?` title="${esc(e.nombre)}"`:''}>${e&&e.foto?`<img src="${esc(e.foto)}" alt="">`:esc(initials(e&&e.nombre))}</div>`;
const plus='<svg><use href="#i-plus"/></svg>';
const isEmp=()=>S.mode==='emp';
const me=()=>isEmp()?emp(S.previewEmp||S.linkedEmp):null;
const lower=s=>String(s||'').trim().toLowerCase();

function fotoDeArchivo(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)) return rej(new Error('tipo'));
    const url=URL.createObjectURL(file);const img=new Image();
    // Recorte vertical 4:5 a 640×800 para que se vea nítida en grande en el perfil (en los avatares se recorta en círculo).
    img.onload=()=>{const W=640,H=800,c=document.createElement('canvas');c.width=W;c.height=H;
      const iw=img.naturalWidth,ih=img.naturalHeight,r=W/H,sw=iw/ih>r?ih*r:iw,sh=iw/ih>r?ih:iw/r;
      const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,W,H);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.84))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('lectura'))};
    img.src=url;});
}

/* ================= tema ================= */
function getTheme(){const a=document.documentElement.getAttribute('data-theme');if(a)return a;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function paintThemeSwitch(){const t=getTheme();document.querySelectorAll('[data-set-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.setTheme===t)))}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ark-theme',t)}catch(e){}paintThemeSwitch()}
try{const s=localStorage.getItem('ark-theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}
document.addEventListener('click',e=>{const b=e.target.closest('[data-set-theme]');if(b)setTheme(b.dataset.setTheme)});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',paintThemeSwitch);

/* ================= datos (Supabase) ================= */
const SB_URL='https://tuaxfleudqxmvoicssqw.supabase.co', SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1YXhmbGV1ZHF4bXZvaWNzc3F3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTUxMjEsImV4cCI6MjEwNjg3MTEyMX0.GBXnLj1xiPn7GsaXdysfoODsbfGuL-q6FFG78BZLGPQ';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const TABLAS=['empleados','clientes','eventos','finanzas','juntas','config','propuestas','notas'];
const toRow=r=>({id:r.id,...(r.data||{})});
async function load(col){
  if(col==='accesos'){
    const {data:rows,error}=await sb.from('perfiles').select('empleado_id,usuario').eq('rol','empleado');
    if(error)throw error;data.accesos=(rows||[]).map(r=>({id:r.empleado_id,usuario:r.usuario}));return;
  }
  // notas: también el autor (columna) para saber quién puede borrarlas
  const {data:rows,error}=await sb.from(col).select(col==='notas'?'id,data,autor':'id,data').limit(5000);
  if(error)throw error;data[col]=(rows||[]).map(r=>col==='notas'?{...toRow(r),autor:r.autor}:toRow(r));
}
async function add(col,obj){
  obj.creado=Date.now();
  const {data:row,error}=await sb.from(col).insert({data:obj}).select('id').single();
  if(error)throw error;await load(col);refresh();return row.id;
}
async function setDoc(col,id,obj){
  const {error}=await sb.from(col).upsert({id,data:obj});if(error)throw error;await load(col);refresh();
}
async function save(col,id,patch){
  const cur=(data[col].find(x=>x.id===id))||{};const merged={...cur,...patch};delete merged.id;
  const {error}=await sb.from(col).update({data:merged}).eq('id',id);if(error)throw error;await load(col);refresh();
}
async function remove(col,id){
  const {error}=await sb.from(col).delete().eq('id',id);if(error)throw error;await load(col);refresh();
}
async function rpc(fn,args){const {error}=await sb.rpc(fn,args);if(error)throw error;await load('accesos');refresh()}
function showCreds(nombre,usuario,pw){
  const txt=`ARK · ${nombre}\nCorreo: ${usuario}\nContraseña: ${pw}\nEntra en: https://arkdashboardmx.netlify.app`;
  modal('Acceso listo',`<div class="full creds-box" style="grid-column:1/-1"><p style="margin:0 0 12px;color:var(--muted)">Comparte estos datos con ${esc(nombre)}. La contraseña no se vuelve a mostrar; si se pierde, crea una nueva.</p>
    <pre id="creds-txt">${esc(txt)}</pre><button type="button" class="btn btn-sm" id="creds-copy">Copiar</button></div>`,{onSubmit:async()=>{},submitLabel:'Listo'});
  document.getElementById('creds-copy').onclick=()=>{navigator.clipboard.writeText(txt).then(()=>toast('Copiado')).catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('creds-txt'));const sl=getSelection();sl.removeAllRanges();sl.addRange(r);toast('Selecciona y copia el texto')})};
}
function setSync(on,text){const s=document.getElementById('sync');s.classList.toggle('on',on);s.querySelector('span').textContent=text}
let canal=null;const pendientes={};
function suscribir(cols){
  if(canal)sb.removeChannel(canal);
  canal=sb.channel('ark');
  cols.forEach(c=>canal.on('postgres_changes',{event:'*',schema:'public',table:c==='accesos'?'perfiles':c},()=>{
    clearTimeout(pendientes[c]);pendientes[c]=setTimeout(async()=>{try{const antes=c==='clientes'?new Set(data.clientes.map(x=>x.id)):null;
      await load(c);
      if(antes){data.clientes.filter(x=>!antes.has(x.id)&&x.origen==='Encuesta'&&(!isEmp()||x.empleadoId===me().id)).forEach(avisoProspecto)}
      if(c==='clientes'||c==='finanzas')await cargarExtras();
      refresh();
      if(c==='notas'){const b=document.getElementById('notas-box'),cl=b&&cli(b.dataset.cliente);if(cl)pintarNotas(cl)}
      if(c==='propuestas'){const b=document.getElementById('prop-box'),cl=b&&data.clientes.find(x=>x.id===b.dataset.cliente);if(cl)pintarProp(cl)}}catch(e){}},250)}));
  canal.subscribe(st=>{if(st==='SUBSCRIBED')setSync(true,'Sincronizado');else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')setSync(false,'Sin conexión en vivo')});
}

/* ================= avisos ================= */
let tt;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
function writeError(e){
  const c=e&&e.code,m=e&&e.message||'';
  if(c==='P0001'&&m)toast(m);
  else if(c==='42501'||/row-level security|permission/i.test(m))toast('Tu cuenta no tiene permiso para hacer este cambio.');
  else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
}

/* ================= acceso (Supabase Auth) ================= */
const acceso=id=>data.accesos.find(a=>a.id===id);
function genPw(){const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint8Array(10));return [...r].map(x=>c[x%c.length]).join('')}
const emailDe=u=>u.includes('@')?u:u+'@arkstudio.app';
function renderLogin(){
  const card=document.getElementById('login-card');
  const head=`<svg class="mark"><use href="#ark-mark"/></svg><span class="wordmark">ARK</span><span class="tagline">Apps a la medida</span>`;
  if(S.cargando){card.innerHTML=head+'<p>Cargando…</p>';return}
  if(card.querySelector('#login-form'))return;
  card.innerHTML=head+`<form class="login-form" id="login-form" novalidate>
      <label>Correo<input id="lg-user" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="tu@correo.com" required></label>
      <label>Contraseña<input id="lg-pass" type="password" autocomplete="current-password" required></label>
      <p class="err" id="lg-err" hidden></p>
      <button class="btn primary" type="submit" id="lg-btn">Entrar</button>
    </form>
    <span class="fine">¿No tienes acceso? Pídelo al administrador de ARK.</span>`;
}
document.getElementById('login').addEventListener('submit',async e=>{
  if(e.target.id!=='login-form')return;
  e.preventDefault();
  const u=lower(document.getElementById('lg-user').value),pw=document.getElementById('lg-pass').value;
  const err=document.getElementById('lg-err'),btn=document.getElementById('lg-btn');
  const fail=m=>{err.textContent=m;err.hidden=false;btn.disabled=false;btn.textContent='Entrar'};
  if(!u||!pw)return fail('Escribe tu correo y tu contraseña.');
  btn.disabled=true;btn.textContent='Verificando…';
  const {error}=await sb.auth.signInWithPassword({email:emailDe(u),password:pw});
  if(error)return fail(/invalid/i.test(error.message)?'Correo o contraseña incorrectos.':'No se pudo iniciar sesión. Revisa tu conexión.');
  try{await iniciarSesion()}catch(x){await sb.auth.signOut();fail('Tu cuenta no tiene un perfil en ARK. Habla con el administrador.')}
});
async function iniciarSesion(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)throw new Error('sin usuario');
  const {data:p,error}=await sb.from('perfiles').select('rol,empleado_id,usuario').eq('user_id',user.id).single();
  if(error||!p)throw error||new Error('sin perfil');
  S.acct={id:user.id,name:(user.user_metadata&&user.user_metadata.nombre)||'',email:user.email,avatarUrl:'',isOwner:p.rol==='admin'};
  const cols=p.rol==='admin'?[...TABLAS,'accesos']:['empleados','clientes','eventos','propuestas','notas'];
  await Promise.all(cols.map(load));
  await cargarExtras();
  suscribir(cols);
  clearInterval(extrasTimer);extrasTimer=setInterval(()=>cargarExtras().then(refresh).catch(()=>{}),5*60*1000);
  if(p.rol==='admin'){S.mode='admin'}else{S.mode='emp';S.linkedEmp=p.empleado_id;S.previewEmp=null}
  enter();
}
function enter(){
  ui.view=isEmp()?'inicio':'panel';
  ui.fEmp='todos';ui.calEmp='todos';ui.fEst='todos';ui.q='';
  document.getElementById('login').hidden=true;
  document.getElementById('shell').hidden=false;
  refresh();
}
async function logout(){
  if(S.previewEmp&&S.acct&&S.acct.isOwner){S.mode='admin';S.previewEmp=null;refresh();return}
  await sb.auth.signOut();
  if(canal){sb.removeChannel(canal);canal=null}
  TABLAS.forEach(c=>data[c]=[]);data.accesos=[];
  clearInterval(extrasTimer);extra.ajustes={};extra.ranking=[];extra.misVentas=null;
  S.mode='login';S.previewEmp=null;S.linkedEmp=null;S.acct=null;
  document.getElementById('shell').hidden=true;
  document.getElementById('login').hidden=false;
  document.getElementById('login-card').innerHTML='';
  renderLogin();
}

const main=document.getElementById('main');
function refresh(){
  if(S.mode==='login'){renderLogin();return}
  if(isEmp()&&!me()){ // perfil borrado o acceso retirado
    if(S.previewEmp){S.mode='admin';S.previewEmp=null}else{logout();return}
  }
  if(isEmp()){ui.fEmp=me().id;ui.calEmp=me().id}
  const views=isEmp()?{inicio:vInicio,clientes:vClientes,calendario:vCal}:{panel:vPanel,finanzas:vFinanzas,clientes:vClientes,calendario:vCal,juntas:vJuntas,equipo:vEquipo};
  if(!views[ui.view])ui.view=Object.keys(views)[0];
  renderChrome();
  const fid=document.activeElement&&document.activeElement.id,keepFocus=fid==='q'||fid==='jq';
  main.innerHTML=views[ui.view]();
  if(keepFocus){const q=document.getElementById(fid);q.focus();q.setSelectionRange(q.value.length,q.value.length)}

function header(eyebrow,title,sub,action){
  return `<div class="head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${action||''}</div>`;
}

/* ----- finanzas: cálculos ----- */
function periodo(p){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth();
  if(p==='mes')return {a:iso(new Date(y,m,1)),b:iso(new Date(y,m+1,0)),pa:iso(new Date(y,m-1,1)),pb:iso(new Date(y,m,0)),l:'este mes',pl:'mes anterior'};
  if(p==='tri')return {a:iso(new Date(y,m-2,1)),b:iso(new Date(y,m+1,0)),pa:iso(new Date(y,m-5,1)),pb:iso(new Date(y,m-2,0)),l:'últimos 3 meses',pl:'3 meses previos'};
  if(p==='anio')return {a:`${y}-01-01`,b:`${y}-12-31`,pa:`${y-1}-01-01`,pb:iso(new Date(y-1,m,t.getDate())),l:'este año',pl:'mismo periodo del año pasado'};
  return {a:'0000-01-01',b:'9999-12-31',l:'todo el historial'};
}
const enRango=(f,a,b)=>f>=a&&f<=b;
function totales(a,b){
  const M=data.finanzas.filter(x=>enRango(x.fecha||'',a,b));
  const ing=M.filter(x=>x.tipo==='ingreso').reduce((s,x)=>s+(Number(x.monto)||0),0);
  const egr=M.filter(x=>x.tipo==='egreso').reduce((s,x)=>s+(Number(x.monto)||0),0);
  return {M,ing,egr,ut:ing-egr,mg:ing?Math.round((ing-egr)/ing*100):null};
}
function deltaTxt(cur,prev,label){
  if(prev==null)return '';
  if(!prev)return `<span class="delta">sin datos del ${label}</span>`;
  const d=Math.round((cur-prev)/Math.abs(prev)*100);
  return `<span class="delta">${d>=0?'▲':'▼'} ${Math.abs(d)}% vs ${label}</span>`;
}
function porCobrar(){
  return data.clientes.filter(c=>c.estado==='cerrado'&&Number(c.valor)>0).map(c=>{
    const cob=data.finanzas.filter(x=>x.tipo==='ingreso'&&x.clienteId===c.id).reduce((s,x)=>s+(Number(x.monto)||0),0);
    return {c,cob,saldo:Number(c.valor)-cob};
  }).filter(r=>r.saldo>0).sort((a,b)=>b.saldo-a.saldo);
}
function niceMax(v){if(v<=0)return 10000;const p=10**Math.floor(Math.log10(v)),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

function vPanel(){
  const C=data.clientes, activos=C.filter(c=>!['cerrado','perdido'].includes(c.estado));
  const cerrados=C.filter(c=>c.estado==='cerrado');
  const pipeline=activos.reduce((s,c)=>s+(Number(c.valor)||0),0);
  const lim=new Date();lim.setDate(lim.getDate()+7);const limS=iso(lim);
  const prox=data.eventos.filter(e=>e.fecha>=today).sort(sortEv);
  const semana=prox.filter(e=>e.fecha<=limS).length;
  const P=periodo('mes'),T=totales(P.a,P.b);
  const cxc=porCobrar().reduce((s,r)=>s+r.saldo,0);
  const hoy=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  const funnel=ESTADOS.slice(0,5).map((s,i)=>`<div class="fstep ${i===4?'last':''}"><b>${C.filter(c=>c.estado===s.k).length}</b><span>${s.l}</span></div>`).join('');
  const rows=sortedEmps().map(e=>{const mine=C.filter(c=>c.empleadoId===e.id);const cer=mine.filter(c=>c.estado==='cerrado');return {e,t:mine.length,c:cer.length,v:cer.reduce((s,c)=>s+(Number(c.valor)||0),0)}}).sort((a,b)=>b.t-a.t||b.c-a.c);
  const max=Math.max(1,...rows.map(r=>r.t));
  const rank=rows.length?rows.map(r=>`<div class="rank-row">${av(r.e)}
      <div style="min-width:0"><b style="font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.e.nombre)}</b>
      <div class="bar" title="${r.c} cerrados de ${r.t}"><i style="width:${r.c/max*100}%"></i><i class="open" style="width:${(r.t-r.c)/max*100}%"></i></div></div>

  const list=prox.slice(0,6).map(evRow).join('')||`<div class="empty"><strong>No hay citas próximas</strong>Agenda llamadas y reuniones desde el Calendario.</div>`;
  const nsg=sinGrabar(data.eventos).length;
  const bannerG=nsg?`<div class="banner"><span>${nsg===1?'1 junta virtual':nsg+' juntas virtuales'} sin grabación en Grain.</span><button type="button" data-go="juntas">Revisar</button></div>`:'';
  return bannerG+header('Hoy es '+hoy,'Panel de ARK','Clientes, dinero y agenda de la empresa en una vista.',
      `<button class="btn primary" data-act="new-client">${plus}Nuevo cliente</button>`)+
    `<section class="glass stats">
      <div class="stat"><b>${moneyShort(T.ing)}</b><span>Ingresos del mes</span></div>
      <div class="stat"><b>${moneyShort(T.ut)}</b><span>Utilidad del mes${T.mg!=null?' · '+T.mg+'% margen':''}</span></div>
      <div class="stat"><b>${moneyShort(cxc)}</b><span>Por cobrar a clientes</span></div>
      <div class="stat"><b>${moneyShort(pipeline)}</b><span>En proceso · ${activos.length} clientes</span></div>
    </section>
    <section class="glass panel"><h2>Embudo de prospección <span class="tag">${cerrados.length} cerrados · ${semana} citas en 7 días</span></h2><div class="funnel">${funnel}</div></section>
    <div class="grid-2">
      <section class="glass panel"><h2>Clientes por empleado <span class="tag">sólido = cerrados</span></h2><div class="rank">${rank}</div></section>
      <section class="glass panel"><h2>Próximas citas <button class="btn btn-sm ghost" data-go="calendario">Ver calendario</button></h2><div class="list">${list}</div></section>
    </div>`;
}

const VIRT_DEF=['Llamada','Reunión','Presentación','Seguimiento'];
const modalidad=e=>e.modalidad||(VIRT_DEF.includes(e.tipo)?'Virtual':'Presencial');
function nowStr(){const d=new Date();return iso(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
const yaPaso=e=>(e.fecha+' '+(e.hora||'23:59'))<nowStr();
const sinGrabar=list=>list.filter(e=>modalidad(e)==='Virtual'&&yaPaso(e)&&!e.grabacion);

const minutos=d=>{const p=String(d||'').split(':').map(Number);return p.length===3?p[0]*60+p[1]+Math.round(p[2]/60):0};

/* ----- FINANZAS (admin) ----- */
function vFinanzas(){
  const P=periodo(ui.per),T=totales(P.a,P.b),PT=P.pa?totales(P.pa,P.pb):null;
  const pers=[['mes','Este mes'],['tri','3 meses'],['anio','Este año'],['todo','Todo']].map(([k,l])=>`<button class="chip-btn" data-per="${k}" aria-pressed="${ui.per===k}">${l}</button>`).join('');
  // 12 meses
  const t=new Date(),months=[];
  for(let i=11;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);const k=iso(d).slice(0,7);
    const r=totales(k+'-01',k+'-31');months.push({k,l:d.toLocaleDateString('es-MX',{month:'short'}).replace('.',''),y:d.getFullYear(),...r})}
  const mx=niceMax(Math.max(...months.map(m=>Math.max(m.ing,m.egr))));
  const ticks=[0,.5,1];

      <div class="yaxis">${ticks.map(f=>`<span style="bottom:${f*100}%">${moneyShort(mx*f)}</span>`).join('')}</div>
      <div class="plot">${ticks.slice(1).map(f=>`<div class="gl" style="bottom:${f*100}%"></div>`).join('')}

      </div>
      <div class="xlab">${months.map(m=>`<span>${m.l}</span>`).join('')}</div></div>`;
  // categorías de egreso
  const cats={};T.M.filter(x=>x.tipo==='egreso').forEach(x=>{cats[x.categoria||'Otro gasto']=(cats[x.categoria||'Otro gasto']||0)+(Number(x.monto)||0)});
  const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const cmax=Math.max(1,...catRows.map(r=>r[1]));
  const catHtml=catRows.length?catRows.map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><span class="v">${money(v)} · ${T.egr?Math.round(v/T.egr*100):0}%</span><div class="track"><i style="width:${v/cmax*100}%"></i></div></div>`).join('')
    :`<div class="empty"><strong>Sin egresos en ${P.l}</strong>Registra nómina, software, publicidad y demás gastos.</div>`;

    :`<div class="empty"><strong>Sin ingresos en ${P.l}</strong>Registra anticipos y pagos ligados a cada cliente.</div>`;

  const cxc=porCobrar();

    :`<div class="empty"><strong>Aún no hay ventas pagadas</strong>Una venta cuenta cuando registras el primer ingreso de un cliente en Finanzas.</div>`;
  // movimientos
  let M=[...T.M];if(ui.fMov!=='todos')M=M.filter(x=>x.tipo===ui.fMov);
  M.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.creado||0)-(a.creado||0));

/* ----- INICIO (empleado) ----- */
function vInicio(){
  const m=me(),mine=data.clientes.filter(c=>c.empleadoId===m.id);
  const act=mine.filter(c=>!['cerrado','perdido'].includes(c.estado));
  const myEv=data.eventos.filter(e=>e.empleadoId===m.id&&e.fecha>=today).sort(sortEv);
  const hoyEv=myEv.filter(e=>e.fecha===today);
  const R=resumenBonos(m.id),meta=Number(m.meta)||0;
  const DIA=864e5,ahora=Date.now();
  // qué sigue: los más viejos primero; enfriándose: 5+ días sin movimiento
  const sigue={prospecto:'Hacer la primera llamada',llamada:'Mandar el WhatsApp con la información',whatsapp:'Dar seguimiento y agendar reunión',propuesta:'Cerrar la propuesta'};
  const mov=c=>c.actualizado||c.creado||0;
  const seg=act.filter(c=>sigue[c.estado]).sort((a,b)=>mov(a)-mov(b));
  const frios=seg.filter(c=>mov(c)&&ahora-mov(c)>5*DIA);
  const nuevos=mine.filter(c=>c.origen==='Encuesta'&&c.estado==='prospecto'&&ahora-(c.creado||0)<2*DIA).sort((a,b)=>(b.creado||0)-(a.creado||0));
  const filaCli=(c,sub)=>{const wa=linkWA(c);return `<div class="ev cli-fila"><button class="cli-main" data-edit-client="${c.id}"><div class="t">${esc(c.empresa)}</div><div class="s">${sub}</div></button>
      <div class="cli-acts">${wa?`<a class="btn btn-sm" href="${esc(wa)}" target="_blank" rel="noopener" aria-label="WhatsApp a ${esc(c.empresa)}">WhatsApp</a>`:''}<span class="st ${c.estado}">${estado(c.estado).l}</span></div></div>`};
  // prepara tu llamada: próxima cita (hoy o mañana) ligada a un cliente con propuesta lista
  const manana=iso(new Date(ahora+DIA));
  const clienteDeCita=e=>cli(e.clienteId)||mine.find(c=>c.empresa&&String(e.titulo||'').toLowerCase().includes(c.empresa.toLowerCase()));
  const prep=myEv.filter(e=>e.fecha<=manana).map(e=>({e,c:clienteDeCita(e)})).find(x=>x.c&&propDe(x.c.id)&&propDe(x.c.id).datos);
  let prepHtml='';
  if(prep){const p=propDe(prep.c.id),pr=(p.datos&&p.datos.pricing)||{},obj=pr.target_price_mxn??pr.development_price_mxn,min=pr.minimum_acceptable_price_mxn??pr.minimum_negotiation_price_mxn;
    const cuando=prep.e.fecha===today?'Hoy':'Mañana';
    prepHtml=`<section class="glass panel prepara"><h2>Prepara tu llamada <span class="tag">${cuando}${prep.e.hora?' · '+esc(prep.e.hora):''}</span></h2>
      <div class="prepara-in"><div><b>${esc(prep.c.empresa)}</b><span>${esc(prep.e.titulo||prep.e.tipo||'Cita')}</span></div>
        <div class="prop-sum">${obj?`<div><span>Objetivo</span><b>${money(obj)}</b></div>`:''}${pr.offer_price_mxn?`<div><span>Oferta</span><b>${money(pr.offer_price_mxn)}</b></div>`:''}${min?`<div><span>Mínimo</span><b>${money(min)}</b></div>`:''}</div>
        <div class="pf-acts"><button class="btn btn-sm primary" data-prepara="${prep.c.id}" data-paso="1">Ver guion y preguntas</button><button class="btn btn-sm" data-prepara="${prep.c.id}" data-paso="2">Presentación</button><button class="btn btn-sm ghost" data-edit-client="${prep.c.id}">Notas</button></div></div></section>`}
  // recordatorios de notas que ya vencen
  const recs=data.notas.filter(n=>n.recordatorio&&!n.hecho&&n.recordatorio<=today&&mine.some(c=>c.id===n.clienteId)).sort((a,b)=>a.recordatorio.localeCompare(b.recordatorio));
  const recHtml=recs.length?`<section class="glass panel"><h2>Recordatorios <span class="tag">${recs.length}</span></h2><div class="list">${recs.map(n=>{const c=cli(n.clienteId);return `<div class="ev cli-fila"><button class="cli-main" data-edit-client="${c.id}"><div class="t">${esc(c.empresa)}</div><div class="s">${esc(n.texto)}</div></button><div class="cli-acts"><span class="s">${n.recordatorio<today?'Vencido':'Hoy'}</span><button class="btn btn-sm" data-nota-hecha="${n.id}">Hecho</button></div></div>`}).join('')}</div></section>`:'';
  // meta, bonos y ranking
  const pctMeta=meta?Math.min(100,Math.round(R.nMes/meta*100)):0;
  const sigBono=R.siguiente?`Te ${R.siguiente.faltan===1?'falta 1 venta':'faltan '+R.siguiente.faltan+' ventas'} para el bono de <b>${money(R.siguiente.bono)}</b>`:(R.B.escalones.length?'Ya alcanzaste el bono más alto del mes':'');
  const rk=rankingMes(),miPos=rk.findIndex(x=>x.e.id===m.id)+1;
  const rkHtml=rk.length?`<div class="ranking">${rk.map((x,i)=>`<div class="rk${x.e.id===m.id?' yo':''}"><span class="pos">${i+1}</span>${av(x.e,'sm')}<span class="nom">${esc(x.e.nombre)}</span><b>${x.n}</b></div>`).join('')}</div>`:'<p class="pf-vacio">Sin ventas este mes todavía.</p>';
  const mat=((extra.ajustes.material||{}).items||[]);
  const matHtml=mat.length?`<section class="glass panel" style="grid-column:1/-1"><h2>Material de ventas</h2><div class="list">${mat.map(x=>`<div class="ev cli-fila"><div class="cli-main" style="cursor:default"><div class="t">${esc(x.titulo||'Material')}</div><div class="s">${esc(x.texto)}</div></div><div class="cli-acts"><button class="btn btn-sm" data-copy="${esc(x.texto)}">Copiar</button></div></div>`).join('')}</div></section>`:'';
  const nuevosHtml=nuevos.length?`<section class="glass panel nuevos" style="grid-column:1/-1"><h2>Prospectos nuevos <span class="tag">${nuevos.length}</span></h2><div class="list">${nuevos.map(c=>filaCli(c,`Llenó la encuesta ${new Date(c.creado).toLocaleString('es-MX',{weekday:'short',hour:'2-digit',minute:'2-digit'})}${c.contacto?' · '+esc(c.contacto):''}`)).join('')}</div></section>`:'';
  const segHtml=seg.length?seg.slice(0,6).map(c=>filaCli(c,sigue[c.estado])).join(''):`<div class="empty"><strong>Todo al día</strong>Registra a tu próximo prospecto con “Nuevo cliente”.</div>`;
  const friosHtml=frios.length?`<section class="glass panel"><h2>Se están enfriando <span class="tag">5+ días sin movimiento</span></h2><div class="list">${frios.slice(0,5).map(c=>filaCli(c,'Sin movimiento hace '+Math.floor((ahora-mov(c))/DIA)+' días')).join('')}</div></section>`:'';
  const agHtml=myEv.slice(0,6).map(evRow).join('')||`<div class="empty"><strong>Agenda libre</strong>Agenda tu próxima llamada o reunión.</div>`;
  const hora=new Date().getHours(),sal=hora<12?'Buenos días':hora<19?'Buenas tardes':'Buenas noches';
  const misSG=sinGrabar(data.eventos.filter(e=>e.empleadoId===m.id));
  const bannerE=misSG.length?`<div class="banner"><span>Tienes ${misSG.length===1?'1 junta virtual':misSG.length+' juntas virtuales'} sin grabar. Revisa que Grain esté conectado a tu calendario antes de tu próxima llamada.</span></div>`:'';
  const bannerPush=!pushActivo()&&!S.previewEmp?`<div class="banner"><span>Activa las notificaciones para enterarte al momento de prospectos nuevos y de tus citas, aunque tengas la app cerrada.</span><button class="btn btn-sm primary" data-act="push">Activar</button></div>`:'';
  return bannerE+bannerPush+`<div class="head"><div class="hello"><button class="avatar-btn" data-act="mi-perfil" aria-label="Ver mi perfil">${av(m)}</button><div><div class="eyebrow">${new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${sal}, ${esc(m.nombre.split(' ')[0])}</h1>${m.rol?`<p>${esc(m.rol)}</p>`:''}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="mi-perfil">Mi perfil</button><button class="btn" data-act="new-ev">${plus}Cita</button><button class="btn primary" data-act="new-client">${plus}Nuevo cliente</button></div></div>
    ${nuevosHtml?`<div class="grid-2">${nuevosHtml}</div>`:''}
    ${prepHtml}
    <section class="glass stats">
      <div class="stat"><b>${R.nMes}</b><span>Ventas este mes</span></div>
      <div class="stat"><b>${moneyShort(R.ganadoMesActual)}</b><span>Ganado este mes</span></div>
      <div class="stat"><b>${act.length}</b><span>Clientes en proceso</span></div>
      <div class="stat"><b>${hoyEv.length}</b><span>Citas hoy</span></div>
    </section>
    <div class="grid-2">
      <section class="glass panel"><h2>Meta del mes ${meta?`<span class="tag">${R.nMes} de ${meta}</span>`:''}</h2>
        ${meta?`<div class="meta-barra" role="progressbar" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${R.nMes}"><i style="width:${pctMeta}%"></i></div><p class="meta-txt">${R.nMes>=meta?'¡Cumpliste tu meta del mes!':`Te ${meta-R.nMes===1?'falta 1 venta':'faltan '+(meta-R.nMes)+' ventas'} para tu meta.`}</p>`:'<p class="meta-txt">Tu meta del mes aún no está definida.</p>'}
        ${sigBono?`<p class="meta-txt">${sigBono}</p>`:''}
        <div class="bono-kpis"><div><span>Por venta</span><b>${money(R.B.porVenta)}</b></div><div><span>Ganado total</span><b>${money(R.ganado)}</b></div><div><span>Pagado</span><b>${money(R.pagado)}</b></div><div><span>Pendiente</span><b>${money(R.pendiente)}</b></div></div>
        ${R.B.escalones.length?`<p class="meta-txt" style="margin-top:12px">Bonos: ${R.B.escalones.map(x=>`${x.ventas} ventas → ${money(x.bono)}`).join(' · ')}</p>`:''}
        <p class="ayuda">Una venta cuenta cuando el cliente hace su primer pago.</p></section>
      <section class="glass panel"><h2>Ranking del mes ${miPos?`<span class="tag">Vas en ${miPos}º</span>`:''}</h2>${rkHtml}</section>
      ${recHtml}${friosHtml}
      <section class="glass panel"><h2>Qué sigue con mis clientes</h2><div class="list">${segHtml}</div></section>
      <section class="glass panel"><h2>Mi agenda <button class="btn btn-sm ghost" data-go="calendario">Ver calendario</button></h2><div class="list">${agHtml}</div></section>
      <section class="glass panel" style="grid-column:1/-1"><h2>Tu link de encuesta</h2>
        <div class="link-box"><code>${esc(linkEncuesta(m.id))}</code><button class="btn btn-sm primary" data-copy="${esc(linkEncuesta(m.id))}">Copiar link</button></div>
        <p class="s" style="font-size:13px;color:var(--muted);margin:10px 0 0">Compártelo con tus prospectos. Quien lo llene agenda en tu Google Calendar, y la cita aparece sola en tu agenda de ARK.</p></section>
      ${matHtml}
    </div>`;
}

      <div class="who">${E?`<span style="color:var(--muted)">${esc(c.tipoApp||'Proyecto por definir')}</span>`:e?`${av(e,'sm')}<span>${esc(e.nombre)}</span>`:'<span style="color:var(--faint)">Sin asignar</span>'}</div>

      <span class="money">${c.valor?money(c.valor):'—'}</span>
      <svg class="chev"><use href="#i-right"/></svg></button>`}).join('');
  const total=E?data.clientes.filter(c=>c.empleadoId===ui.fEmp).length:data.clientes.length;
  const empty=total?`<div class="empty"><strong>Nada coincide con el filtro</strong>Prueba con otra etapa o búsqueda.</div>`
    :`<div class="empty"><strong>Aún no hay clientes registrados</strong>Registra el primero con “Nuevo cliente”${E?'':' y asígnalo al empleado que lo trajo'}.</div>`;
  return header(`${total} registrados`,E?'Mis clientes':'Clientes',E?'Los clientes que tú has traído a ARK.':'Cada cliente queda ligado al empleado que lo trajo.',
      `<button class="btn primary" data-act="new-client">${plus}Nuevo cliente</button>`)+

      <div class="chips" style="flex-basis:100%">${chips}</div>

    <section class="glass table">
      <div class="trow thead"><span>Empresa</span><span>${E?'Proyecto':'Lo trajo'}</span><span>Etapa</span><span>Valor</span><span></span></div>
      ${C.length?rows:empty}
    </section>`;
}

/* ----- CALENDARIO ----- */
function vCal(){
  const E=isEmp(),m=ui.mes,y=m.getFullYear(),mo=m.getMonth();
  const start=new Date(y,mo,1-((m.getDay()+6)%7));
  const evs=data.eventos.filter(e=>ui.calEmp==='todos'||e.empleadoId===ui.calEmp);
  const byDay={};evs.forEach(e=>{(byDay[e.fecha]=byDay[e.fecha]||[]).push(e)});
  Object.values(byDay).forEach(a=>a.sort(sortEv));
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const list=byDay[k]||[];
    cells+=`<button class="day ${d.getMonth()!==mo?'out':''} ${k===today?'today':''} ${k===ui.dia?'sel':''}" data-day="${k}" aria-label="${fmtDay(k)}, ${list.length} citas">
      <span class="num">${d.getDate()}</span>
      ${list.slice(0,2).map(e=>{const em=emp(e.empleadoId);return `<span class="pill-ev"><b>${esc(e.hora||'')}</b>${esc(e.titulo||e.tipo)}${em&&ui.calEmp==='todos'?' · '+esc(initials(em.nombre)):''}</span>`}).join('')}
      ${list.length>2?`<span class="more">+${list.length-2} más</span>`:''}
      <span class="dots">${list.slice(0,4).map(()=>'<i></i>').join('')}</span></button>`;
  }
  const chips=[{id:'todos',nombre:'Todo el equipo'},...sortedEmps()].map(e=>`<button class="chip-btn" data-calemp="${e.id}" aria-pressed="${ui.calEmp===e.id}">${esc(e.nombre)}</button>`).join('');
  const dayList=byDay[ui.dia]||[];
  const agenda=dayList.length?dayList.map(e=>{const em=emp(e.empleadoId),c=cli(e.clienteId);return `<button class="ev" data-edit-ev="${e.id}">
      <div class="when"><b>${esc(e.hora||'—')}</b>${e.duracion?esc(e.duracion)+' min':''}</div>
      <div style="min-width:0"><div class="t">${esc(e.titulo||e.tipo)}</div><div class="s">${esc(e.tipo)}${c?' · '+esc(c.empresa):''}${em&&!E?' · '+esc(em.nombre):''}</div></div>
      <span class="tag">${esc(e.tipo)}</span></button>`}).join('')
    :`<div class="empty"><strong>Día libre</strong>No hay citas este día.</div>`;
  const title=m.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
  const who=E?'Solo tus citas':ui.calEmp==='todos'?'Agenda de todo el equipo':'Calendario de '+esc(emp(ui.calEmp)?.nombre||'');
  return header(who,E?'Mi agenda':'Calendario',E?'Tus llamadas, reuniones y entregas.':'Cada empleado tiene su propio calendario. Filtra por persona o mira todo el equipo.',
      `<button class="btn primary" data-act="new-ev">${plus}Nueva cita</button>`)+
    (E?'':`<section class="glass toolbar" style="border-radius:22px"><div class="chips">${chips}</div></section>`)+
    `<div class="cal-wrap">
      <section class="glass panel">
        <div class="cal-head"><h2>${title}</h2><div class="navbtns">
          <button class="icon-btn" data-mes="-1" aria-label="Mes anterior"><svg><use href="#i-left"/></svg></button>
          <button class="btn btn-sm ghost" data-mes="0">Hoy</button>
          <button class="icon-btn" data-mes="1" aria-label="Mes siguiente"><svg><use href="#i-right"/></svg></button></div></div>
        <div class="dow">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<span>${d}</span>`).join('')}</div>
        <div class="month">${cells}</div>
      </section>
      <section class="glass panel agenda">
        <div class="cal-head"><h3>${fmtDay(ui.dia)}</h3><button class="btn btn-sm" data-act="new-ev">${plus}Agregar</button></div>
        <div class="list">${agenda}</div>
      </section>
    </div>`;
}

async function cargarExtras(){

    S.mode==='emp'?sb.rpc('mis_ventas'):Promise.resolve({data:null})]);

// Bonos: $ fijo por venta + bono por escalón de ventas en el mes (se paga el escalón más alto alcanzado).
function bonos(){const c=data.config.find(x=>x.id==='bonos')||extra.ajustes.bonos||{};
  return {porVenta:Number(c.porVenta)||0,escalones:(c.escalones||[]).map(x=>({ventas:Number(x.ventas)||0,bono:Number(x.bono)||0})).filter(x=>x.ventas>0).sort((a,b)=>a.ventas-b.ventas)}}
const bonoPara=(n,B=bonos())=>B.escalones.filter(x=>n>=x.ventas).reduce((m,x)=>Math.max(m,x.bono),0);
const ganadoMes=(n,B=bonos())=>n*B.porVenta+bonoPara(n,B);
// Venta = primer pago (ingreso) del cliente. El admin lo calcula con Finanzas; el empleado lo recibe del servidor.
function ventasDe(empId){
  if(S.acct&&S.acct.isOwner){const out=[];
    data.clientes.filter(c=>c.empleadoId===empId).forEach(c=>{const f=data.finanzas.filter(m=>m.tipo==='ingreso'&&m.clienteId===c.id).map(m=>m.fecha).filter(Boolean).sort()[0];if(f)out.push({clienteId:c.id,empresa:c.empresa,fecha:f})});
    return out.sort((a,b)=>b.fecha.localeCompare(a.fecha))}
  return (extra.misVentas&&extra.misVentas.ventas)||[];
}
function pagosDe(empId){
  if(S.acct&&S.acct.isOwner)return data.finanzas.filter(m=>m.tipo==='egreso'&&m.categoria==='Comisiones'&&m.empleadoId===empId).map(m=>({fecha:m.fecha,monto:Number(m.monto)||0}));
  return (extra.misVentas&&extra.misVentas.pagos)||[];
}
function resumenBonos(empId){
  const B=bonos(),V=ventasDe(empId),porMes={};V.forEach(v=>{const k=String(v.fecha).slice(0,7);porMes[k]=(porMes[k]||0)+1});
  const ganado=Object.values(porMes).reduce((s,n)=>s+ganadoMes(n,B),0);
  const pagado=pagosDe(empId).reduce((s,m)=>s+(Number(m.monto)||0),0);
  const mes=today.slice(0,7),nMes=porMes[mes]||0,sig=B.escalones.find(x=>x.ventas>nMes);
  return {B,V,porMes,ganado,pagado,pendiente:Math.max(0,ganado-pagado),nMes,ganadoMesActual:ganadoMes(nMes,B),
    siguiente:sig?{faltan:sig.ventas-nMes,bono:sig.bono,ventas:sig.ventas}:null};
}
// Ranking del mes (solo totales) con nombre y foto de cada quien.
function rankingMes(){
  const r=extra.ranking.map(x=>({e:emp(x.empleado_id),n:Number(x.ventas)||0})).filter(x=>x.e);
  return r.sort((a,b)=>b.n-a.n||a.e.nombre.localeCompare(b.e.nombre));
}

const VAPID_PUBLICA='BDo8fxg5W3Hs62L_QeJqCdhTahDjnQuLXkFMNIZ3tUJdGun2eniThnj3juaBSJR7T5j3bN4HQwAWGeHzNG89ASg';
const pushSoportado=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const esIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent),instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function b64aU8(b){const p='='.repeat((4-b.length%4)%4),r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(ch=>ch.charCodeAt(0)))}
async function activarPush(){
  if(esIOS()&&!instalada()){toast('En iPhone, primero agrega ARK a tu pantalla de inicio (Compartir → Agregar a inicio) y ábrela desde ahí.');return}
  if(!pushSoportado()){toast('Este navegador no permite notificaciones.');return}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('Las notificaciones quedaron bloqueadas. Actívalas en los ajustes del navegador.');return}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64aU8(VAPID_PUBLICA)});
    const {error}=await sb.from('push_suscripciones').upsert({endpoint:sub.endpoint,data:sub.toJSON()},{onConflict:'endpoint'});
    if(error)throw error;
    toast('Listo: te avisaremos de prospectos nuevos y de tus citas.');refresh();

}

// Markdown sencillo de Claude (negritas, cursivas, listas, tablas, títulos) a HTML seguro.
function mdBasico(t){
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>');
  const out=[];let lista=null,tabla=null;
  const cerrar=()=>{if(lista){out.push('<ul>'+lista.join('')+'</ul>');lista=null}if(tabla){out.push('<table>'+tabla.join('')+'</table>');tabla=null}};
  for(const l of String(t||'').split('\n')){
    const s=l.trim();
    if(/^\|.*\|$/.test(s)){if(/^\|[\s:|-]+\|$/.test(s))continue;if(lista){out.push('<ul>'+lista.join('')+'</ul>');lista=null}
      const cel=s.slice(1,-1).split('|').map(x=>x.trim());tabla=tabla||[];const tag=tabla.length?'td':'th';
      tabla.push('<tr>'+cel.map(x=>`<${tag}>${inl(x)}</${tag}>`).join('')+'</tr>');continue}
    if(/^[-*•]\s+/.test(s)){if(tabla){out.push('<table>'+tabla.join('')+'</table>');tabla=null}(lista=lista||[]).push('<li>'+inl(s.replace(/^[-*•]\s+/,''))+'</li>');continue}
    cerrar();
    if(!s||/^[─—=_-]{3,}$/.test(s))continue;
    const h=s.match(/^#{1,6}\s+(.*)$/)||s.match(/^(\d+\.\s+[A-ZÁÉÍÓÚÑ ]{4,})$/);
    out.push(h?`<h4>${inl(h[1])}</h4>`:`<p>${inl(s)}</p>`);
  }
  cerrar();return out.join('');
}
const GIRO_EMOJI={'Restaurante o cafetería':'🍽️','Tienda o comercio':'🛍️','Salud o clínica':'🩺','Belleza o spa':'💇','Gimnasio o deporte':'🏋️',

const parrafos=t=>String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('');
// Recorrido de la propuesta: 1) el negocio (rubro, Google), 2) el guion para presentar, 3) la presentación.
function abrirPropuesta(c,paso,diapo){
  const p=propDe(c.id)||{},d=p.datos||{},pr=d.pricing||{},g=d.google_profile||{},enc=c.encuesta||{};
  const google=c.google||enc.google||'',giro=c.giro||enc.giro||'';

        ${g.website?`<p><b>Sitio:</b> ${esc(g.website)}</p>`:''}${g.summary?`<p>${esc(g.summary)}</p>`:''}</div>`
      :google?'<p class="prop-err" style="margin-top:12px">Claude no pudo consultar el perfil de Google; la propuesta se hizo solo con la encuesta.</p>':'';
    cuerpo=`<div class="negocio-card"><div class="negocio-emoji" aria-hidden="true">${GIRO_EMOJI[giro]||'✨'}</div>

    cuerpo=`${p.incompleta?'<p class="prop-err" style="margin-bottom:8px">La respuesta de Claude quedó cortada; conviene volver a generarla.</p>':''}
      ${G.length?`<p class="ayuda" style="margin:0 0 12px">Léelo mientras compartes la presentación: cada parte va con su diapositiva. Las notas en gris son solo para ti.</p>
        <div class="guion">${G.map(x=>`<article class="guion-d"><header><span class="guion-n">${x.i>=0?String(x.i+1).padStart(2,'0'):'·'}</span><b>${esc(x.nombre)}</b>

  root.querySelectorAll('[data-paso]').forEach(b=>b.onclick=()=>abrirPropuesta(c,+b.dataset.paso));
  root.querySelectorAll('[data-ir]').forEach(b=>b.onclick=()=>abrirPropuesta(c,paso+(+b.dataset.ir)));
  root.querySelectorAll('[data-diapo]').forEach(b=>b.onclick=()=>abrirPropuesta(c,2,+b.dataset.diapo));
  const cp=document.getElementById('prop-copy');
  const G=guionDe(d),copia=G.length?G.map(x=>`${x.i>=0?x.i+1+'. ':''}${x.nombre.toUpperCase()}\n\n${x.guion}${x.nota?`\n\n(Nota: ${x.nota})`:''}`).join('\n\n'):(p.texto||'');
  if(cp)cp.onclick=()=>navigator.clipboard.writeText(copia).then(()=>toast('Copiado')).catch(()=>toast('Selecciona y copia el texto'));
}

function evForm(ev,fecha){
  const v=ev||{fecha:fecha||today,hora:'10:00',duracion:30,tipo:'Llamada',empleadoId:ui.calEmp!=='todos'?ui.calEmp:''};
  const fields=`
    <label class="full">Título<input name="titulo" id="f-titulo" value="${esc(v.titulo)}" placeholder="Llamada de presentación"></label>
    <label>Fecha<input name="fecha" id="f-fecha" type="date" required value="${esc(v.fecha)}"></label>
    <label>Hora<input name="hora" id="f-hora" type="time" value="${esc(v.hora)}"></label>
    <label>Tipo<select name="tipo" id="f-tipo">${TIPOS.map(t=>opt(t,t,t===v.tipo)).join('')}</select></label>
    <label>Duración (min)<input name="duracion" id="f-duracion" type="number" min="5" step="5" value="${esc(v.duracion)}"></label>
    <label>Modalidad<select name="modalidad" id="f-modalidad">${['Virtual','Presencial'].map(m=>opt(m,m,m===modalidad(v))).join('')}</select></label>
    ${v.grabacion?`<div style="grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="rec ok">Grabada en Grain</span><a class="btn btn-sm" href="${esc(v.grabacion)}" target="_blank" rel="noopener">Ver grabación</a></div>`:''}
    ${empSelect('empleadoId',v.empleadoId,'Calendario de')}
    ${cliSelect(v.clienteId)}
    <label class="full">Notas<textarea name="notas" id="f-evnotas">${esc(v.notas)}</textarea></label>`;
  const submit=async f=>{f.duracion=f.duracion?Number(f.duracion):0;if(ev)await save('eventos',ev.id,f);else await add('eventos',f);ui.dia=f.fecha;const d=parse(f.fecha);ui.mes=new Date(d.getFullYear(),d.getMonth(),1);toast(ev?'Cita actualizada':'Cita agendada')};
  submit.validate=f=>!f.fecha?'Elige una fecha.':(!f.empleadoId?'Elige en qué calendario va la cita.':null);
  modal(ev?'Editar cita':'Nueva cita',fields,{onSubmit:submit,onDelete:ev?async()=>{await remove('eventos',ev.id);toast('Cita eliminada')}:null});
}

function movForm(x,tipo,pre){
  const v=x||{tipo,fecha:today,metodo:'Transferencia',...(pre||{})};
  const T=v.tipo;
  const cats=(T==='ingreso'?CAT_IN:CAT_OUT);
  const fields=`
    <input type="hidden" name="tipo" value="${esc(T)}">
    <label class="full">Concepto<input name="concepto" id="f-concepto" value="${esc(v.concepto)}" placeholder="${T==='ingreso'?'Anticipo app de inventario':'Nómina primera quincena'}"></label>
    <label>Monto (MXN)<input name="monto" id="f-monto" type="number" min="0" step="0.01" inputmode="decimal" required value="${esc(v.monto)}"></label>
    <label>Fecha<input name="fecha" id="f-mfecha" type="date" required value="${esc(v.fecha)}"></label>
    <label>Categoría<select name="categoria" id="f-categoria">${cats.map(c=>opt(c,c,c===v.categoria)).join('')}</select></label>
    <label>Método<select name="metodo" id="f-metodo">${METODOS.map(m=>opt(m,m,m===v.metodo)).join('')}</select></label>
    ${cliSelect(v.clienteId)}
    <label>Empleado<select name="empleadoId" id="f-mempleado">${opt('','Ninguno',!v.empleadoId)}${sortedEmps().map(e=>opt(e.id,e.nombre,e.id===v.empleadoId)).join('')}</select></label>
    <label class="full">Notas<textarea name="notas" id="f-mnotas" placeholder="Factura, referencia de pago…">${esc(v.notas)}</textarea></label>`;
  const submit=async f=>{f.monto=Number(f.monto);if(x)await save('finanzas',x.id,f);else await add('finanzas',f);toast(x?'Movimiento actualizado':(T==='ingreso'?'Ingreso registrado':'Egreso registrado'))};
  submit.validate=f=>!(Number(f.monto)>0)?'Escribe un monto mayor a cero.':(!f.fecha?'Elige una fecha.':null);
  modal(x?(T==='ingreso'?'Editar ingreso':'Editar egreso'):(T==='ingreso'?'Nuevo ingreso':'Nuevo egreso'),fields,{onSubmit:submit,onDelete:x?async()=>{await remove('finanzas',x.id);toast('Movimiento eliminado')}:null});
}

function sugerirUsuario(n){const w=String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z\s]/g,'').trim().split(/\s+/).filter(Boolean);return w.length?(w.length>1?w[0][0]+w[w.length-1]:w[0]):''}
function empForm(e,abrirFoto){
  const v=e||{};let foto=v.foto||'';const acc=e?acceso(e.id):null;
  const fields=`<div class="photo-pick"><div class="avatar" id="f-prev">${foto?`<img src="${esc(foto)}" alt="">`:esc(initials(v.nombre))}</div>
      <div><div class="btns"><button type="button" class="btn btn-sm" id="f-pick">${foto?'Cambiar foto':'Subir foto'}</button>
      <button type="button" class="btn btn-sm ghost" id="f-quitar" ${foto?'':'hidden'}>Quitar</button></div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">JPG o PNG, de preferencia vertical y nítida: se ve en grande en el perfil.</div></div>
      <input type="file" id="f-foto" accept="image/*" hidden></div>
    <label class="full">Nombre completo<input name="nombre" id="f-nombre" required value="${esc(v.nombre)}"></label>
    <label class="full">Correo<input name="email" id="f-eemail" type="email" value="${esc(v.email)}"></label>
    <div class="cred"><div class="cred-h"><span>Cuenta para la app de empleados</span>${acc?'<span class="access ok"><i></i>Activa</span>':'<span class="access"><i></i>Sin cuenta</span>'}</div>
      <label>Correo para iniciar sesión<input name="usuario" id="f-usuario" type="email" inputmode="email" autocapitalize="none" spellcheck="false" value="${esc(acc?acc.usuario:(v.email||''))}" placeholder="nombre@gmail.com"></label>
      <label>${acc?'Nueva contraseña':'Contraseña'}<span class="pw-row"><input name="password" id="f-pass" type="text" autocomplete="new-password" placeholder="${acc?'Vacía = no cambiarla':'Mínimo 6 caracteres'}"><button type="button" class="btn btn-sm" id="f-gen">Generar</button></span></label>
      ${acc?'<button type="button" class="btn btn-sm ghost danger" id="f-revoke" style="justify-self:start">Quitar acceso</button>':''}
    </div>
    <label>Rol<input name="rol" id="f-rol" value="${esc(v.rol)}" placeholder="Ventas, desarrollo…"></label>
    <label>Meta de ventas al mes<input name="meta" id="f-meta" type="number" min="0" step="1" inputmode="numeric" value="${esc(v.meta)}" placeholder="4"></label>
    <label class="full">Teléfono<input name="telefono" id="f-etel" type="tel" value="${esc(v.telefono)}"></label>`;
  const submit=async f=>{
    const usuario=lower(f.usuario),pw=f.password;delete f.usuario;delete f.password;
    f.foto=foto;f.meta=f.meta?Number(f.meta):0;f.email=lower(f.email);
    let id=e&&e.id;
    if(e)await save('empleados',e.id,f);else id=await add('empleados',f);
    if(usuario&&pw){await rpc('admin_guardar_acceso',{p_empleado:id,p_usuario:usuario,p_password:pw});
      return ()=>showCreds(f.nombre,usuario,pw)}
    if(acc&&usuario&&usuario!==acc.usuario)await rpc('admin_guardar_acceso',{p_empleado:id,p_usuario:usuario,p_password:null});
    toast(e?'Empleado actualizado':'Empleado agregado');
  };
  submit.validate=f=>{
    if(!f.nombre.trim())return 'Escribe el nombre.';
    const u=lower(f.usuario);
    if(!u&&!f.password)return acc?'Escribe su correo, o usa “Quitar acceso”.':null;
    if(!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(u))return 'Escribe un correo válido, por ejemplo nombre@gmail.com.';
    if(data.accesos.some(a=>a.usuario===u&&(!e||a.id!==e.id)))return 'Ese correo ya lo usa otra persona.';
    if(!acc&&!f.password)return 'Escribe una contraseña o toca “Generar”.';
    if(f.password&&f.password.length<6)return 'La contraseña debe tener al menos 6 caracteres.';
    return null;
  };
  let del=null;
  if(e){del=async()=>{if(acc)await rpc('admin_quitar_acceso',{p_empleado:e.id});await remove('empleados',e.id);toast('Empleado eliminado')};
    del.check=()=>data.clientes.some(c=>c.empleadoId===e.id)||data.eventos.some(x=>x.empleadoId===e.id)?'Tiene clientes o citas asignados. Reasígnalos antes de eliminarlo.':null}
  modal(e?'Editar empleado':'Agregar empleado',fields,{onSubmit:submit,onDelete:del});
  const inp=document.getElementById('f-foto'),prev=document.getElementById('f-prev'),pick=document.getElementById('f-pick'),quitar=document.getElementById('f-quitar');
  const pinta=()=>{prev.innerHTML=foto?`<img src="${esc(foto)}" alt="">`:esc(initials(document.getElementById('f-nombre').value));pick.textContent=foto?'Cambiar foto':'Subir foto';quitar.hidden=!foto};
  pick.onclick=()=>inp.click();
  quitar.onclick=()=>{foto='';pinta()};
  document.getElementById('f-nombre').addEventListener('input',()=>{if(!foto)pinta()});
  inp.onchange=async()=>{const file=inp.files[0];inp.value='';if(!file)return;
    try{foto=await fotoDeArchivo(file);pinta()}catch(err){toast('No se pudo leer esa imagen. Usa un JPG o PNG.')}};
  document.getElementById('f-gen').onclick=()=>{document.getElementById('f-pass').value=genPw();const u=document.getElementById('f-usuario');if(!u.value)u.value=document.getElementById('f-eemail').value.trim().toLowerCase()};
  const rv=document.getElementById('f-revoke');let rvArmed=false;
  if(rv) rv.onclick=async()=>{if(!rvArmed){rvArmed=true;rv.textContent='Toca otra vez para quitarle el acceso';return}
    try{await rpc('admin_quitar_acceso',{p_empleado:e.id});toast('Acceso retirado');close()}catch(err){writeError(err)}};
  if(abrirFoto) inp.click();
}
